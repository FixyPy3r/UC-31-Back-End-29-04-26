<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Meu Cantinho</title>
</head>
<body>
    <h1>Olá, {{ nome }}! Este é o seu cantinho secreto somente seu.</h1>

    <p><strong>Sua cor favorita:</strong> {{ cor }}</p>
    <p><strong>Sua linguagem favorita:</strong> {{ linguagem }}</p>
    <p><strong>Uma frase que me representa:</strong> {{ frase }}</p>

    <p>Você visitou o cantinho {{ visitas }} vez(es) hoje {{ nome }}.</p>

    <a href="{{ url_for('painel') }}">Voltar</a>
</body>
</html>
